services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?TURNSTILE_SITE_KEY is required to build the frontend}
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      - DATA_DIR=/data
    volumes:
      - app-data:/data
  cleanup:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      - DATA_DIR=/data
    volumes:
      - app-data:/data
    entrypoint: ["sh", "-c", "while true; do python -m app.cleanup; sleep 3600; done"]
volumes:
  app-data:
